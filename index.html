<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="Galeria de momentos especiais">
    <title>Felicidades | Álbum de fotos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="page-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>Memórias</span>
        </div>
        <div class="title-block">
            <p class="eyebrow">Álbum de família</p>
            <h1>Felicidades</h1>
            <p class="subtitle">Momentos especiais para guardar para sempre</p>
        </div>
        <div class="memory-count" aria-label="13 memórias">
            <strong>13</strong>
            <span>Memórias</span>
        </div>
    </header>

    <main class="gallery" aria-label="Galeria de fotos">
        <div class="carousel" role="region" aria-label="Carrossel de fotos">
            <div class="image" style="--iterator: 1">
                <img src="imagens/ArleteShow.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 2">
                <img src="imagens/Arnaldinho.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 3">
                <img src="imagens/EuCasamento.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 4">
                <img src="imagens/Lola.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 5">
                <img src="imagens/SaraAnel.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 6">
                <img src="imagens/SarinhaSu.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 7">
                <img src="imagens/SuLinda.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 8">
                <img src="imagens/ThiagoJuiz.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 9">
                <img src="imagens/Noivado.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 10">
                <img src="imagens/MainhaJovem.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 11">
                <img src="imagens/Eubarba.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 12">
                <img src="imagens/Entrada.jpeg" alt="Momento especial em família">
            </div>
            <div class="image" style="--iterator: 13">
                <img src="imagens/Lin.jpeg" alt="Momento especial em família">
            </div>
        </div>
    </main>

    <dialog class="photo-viewer" aria-label="Visualização ampliada da fotografia">
        <div class="photo-viewer-frame">
            <img class="photo-viewer-image" src="" alt="">
            <p>Clique na fotografia para voltar ao álbum</p>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
